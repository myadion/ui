<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="assets/css/font_awesome.min.css">  
    <link rel="stylesheet" href="assets/css/adion.css">  
    <title>Adion UI Kit</title>
  </head>
  <body>
    <span>Hello</span>

    <h1>Liste de séléction sans dropdown:</h1>
    <select class="text-center" name="langs" id="lang-select" size="5">
      <option value="french" selected>Français</option>
      <option value="english">English</option>
      <option value="japanese">Japanese</option>
      <option value="chinese">Chinese</option>
      <option value="spanish">Spanish</option>
    </select>
  
    <h1>Bouton:</h1>
    <a href="#" class="btn auto">Hello</a>
    <button class="auto">Hello</button>
    <button>Hello</button>
    <button class="btn-light">Hello</button>
   
    <h1>Gros bouton:</h1>
   
    <button class="btn-big auto">Hello</button>
    <button class="btn-big">Hello</button>
    <button class="btn-big btn-light b i">Hello</button>

      <h1>Bouton rond:</h1>
      
      <i class="fa fa-check-circle"></i>
   
    <button class="btn-big btn-rounded">Hello</button>
    <button class="btn-big btn-rounded">Hello</button>
    <button class="btn-big btn-rounded btn-light b i">Hello with a beaucoup de texte</button>
    <button class="btn-big btn-rounded btn-light b i">Hello with a beaucoup de texte et encore beaucoup beaucoup de texte et encore plus de texte</button>
  

    <h1>Switch</h1>
    <label class="switch">
      <input type="checkbox">
      <span class="switch-slider"></span>
    </label><br>
    <label class="switch">
      <input checked type="checkbox">
      <span class="switch-slider"></span>
    </label>

    <h1>Bouton + Switch</h1>
    <label for="check" class="btn btn-big btn-switch">
      <span>Activer le service</span>
      <label class="switch">
        <input id="check" type="checkbox">
        <span class="switch-slider"></span>
      </label>
    </button>


    <h1></h1>

  </body>
