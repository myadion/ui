<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="assets/css/font_awesome.min.css">  
    <link rel="stylesheet" href="assets/css/adion.css">  
    <title>MyAdion</title>
  </head>
  <body>
    <svg style="position: absolute;top: 0;z-index: -1;" width="100%" height="auto" viewBox="0 0 1920 415" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M-34.9805 -35C-280.98 29 -36.9804 155.5 261.52 198C560.02 240.5 761.52 124.5 1230.52 6C1699.52 -112.5 2129.52 153.5 1996.02 413" stroke="#5A5A5A" stroke-width="4" stroke-linecap="round" stroke-dasharray="17 17"/>
    </svg>

    <div class="container fluid r">
      <a href="#" class="btn-big btn-white b i"><i class="fas fa-globe-europe"></i></a>
    </div>
    
    <div class="container center">
      <div class="row">
          <div class="col-8 col-o-2 col-md-6 col-md-o-0">
              <h2>Bonjour</h2>
              <p class="bb">Commencez par choisir le domaine digital qui vous intéresse le plus:</p>
          </div>
          <div class="col-8 col-o-2 col-md-5 col-md-o-1">
              <select class="text-center" name="domains" id="domain-select" size="5">
                  <option value="web" selected>Web</option>
                  <option value="cloud">Cloud</option>
                  <option value="telecom">Télécom</option>
                  <option value="design">Design</option>
                  <option value="apps">Apps</option>
                </select>
          </div>
      </div>
    </div>

    
    <div class="container fluid bottom-center o-b-green">
      <img width="50px" src="assets/img/logo_adion.png" alt="Logo Adion">
    </div>

    <div class="container fluid" style="bottom:0;position:absolute;">
      <a href="https://status.myadion.com">Status des services</a>
      <a href="https://adion-help.eu">Centre d'aide</a>
    </div>

  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
</html>
