<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        

        <link rel="stylesheet" href="assets/css/font-awesome/font-awesome-5-14.css">  
        <link rel="stylesheet" href="assets/css/fullpage/fullpage.css">  
        <link rel="stylesheet" href="assets/css/adion-ui-kit.css">  
        <link rel="shortcut icon" href="assets/img/logo_adion.png">
        <title>Adion - Cloud Web Télécom and more</title>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
        <script type="text/javascript" src="assets/js/adion-ui-kit/fullpage/fullpage.min.js"></script>
    </head>
    <body>
        <div id="nav" class="side-nav">
            <ul>
                <li class="category"><span>General</span></li>
                <li><a data-menuanchor="section2" class href="#">Accueil</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
                <li class="category"><span>General</span></li>
                <li><a href="#">Accueil</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
        <div id="welcome">
            <div class="section container fluid bg-gr-1">
                <div class="home-header c">
                    <img src="assets/img/logo_adion.png" width="150px" alt="Adion Logo">
                </div>
                <div class="home-title c">
                    <img src="assets/svg/human_on_desktop.svg" alt="Human on desktop">
                    <h1><span class="b">Bienvenue</span><br> dans le monde du <span class="b">digital</span></h1>
                </div>
                <div class="home-action row">
                    <div class="col-8 col-o-2">
                        <a href="#" class="btn btn-white bbbb c mb-15">Découvrir nos services</a>
                        <a href="#" class="btn btn-green bbbb c">Nous contacter</a>
                    </div>
                </div>
            </div>
            <div class="section bg-gr-1">
                <div class="container fluid">
                    <div class="col-10 col-o-2">
                        <h1>Section 2</h1>
                    </div>
                </div>
            </div>
            <div class="section bg-gr-1">
                <div class="container fluid">
                    <div class="col-10 col-o-2">
                        <h1>Section 3</h1>
                    </div>
                </div>
            </div>
            <div class="section bg-gr-3">
                <div class="container fluid">
                    <div class="col-10 col-o-2">
                        <h1>Section 4</h1>
                    </div>
                </div>
            </div>
            <div class="section bg-gr-4">
                <div class="container fluid">
                    <div class="col-10 col-o-2">
                        <h1>Section 5</h1>
                    </div>
                </div>
            </div>
            <div class="section bg-gr-5">
                <div class="container fluid">
                    <div class="col-10 col-o-2">
                        <h1>Section 6</h1>
                    </div>
                </div>
            </div>
            <div class="section bg-gr-6">
                <div class="container fluid">
                    <div class="col-10 col-o-2">
                        <h1>Section 7</h1>
                    </div>
                </div>
            </div>
        </div>

        <script>

            var test = new $('#welcome').fullpage({
                anchors: ['home', 'section2', 'section3', 'section4', 'section5', 'section6', 'section7'],
                scrollBar: false,
                menu: "#nav",
                slidesNavPosition: 'bottom',
                verticalCentered: true,
                scrollingSpeed: 500,
                css3: true,
                afterLoad: function(anchorLink, index){
                    if (index > 1){
                        $('#nav').fadeTo(.1, 1);
                    }
                },
                onLeave: function(index, nextIndex, direction){
                    if (index == 2 && direction == 'up') {
                        $('#nav').fadeTo(.1, 0);
                    }
                }
            });
        
        </script>
    </body>
</html>
